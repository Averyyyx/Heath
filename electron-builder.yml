appId: com.nexo.app
productName: Nexo
copyright: Copyright © 2026 Nexo

directories:
  output: dist
  buildResources: build

files:
  - "package.json"
  - "server.js"
  - "electron/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/{test,tests,__tests__,docs,example,examples}/**"

asar: true
# Сервер запускается как отдельный процесс из app.asar.unpacked (Electron как Node).
# Модули ищутся от этого каталога, а не из app.asar, поэтому node_modules нужно
# распаковать целиком (раньше распаковывался только better-sqlite3, и express и др. не находились).
asarUnpack:
  - "server.js"
  - "public/**/*"
  - "electron/**/*"
  - "node_modules/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-Setup.${ext}"
  signAndEditExecutable: false
  icon: "electron/icons/Nexo-Desctop-ico.ico"

publish:
  - provider: github
    owner: Averyyyx
    repo: Nexo
    releaseType: release

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexo

extraMetadata:
  main: electron/main.js

# Нативные модули пересобираются под Electron в postinstall (electron-builder install-app-deps)
npmRebuild: false
buildDependenciesFromSource: false
