appId: com.nexo.app
productName: Hearth
copyright: Copyright © 2026 Hearth

directories:
  output: dist
  buildResources: resources

files:
  - "package.json"
  - "src/server/**/*"
  - "src/main/**/*"
  - "src/preload/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/{test,tests,__tests__,docs,example,examples}/**"

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

asar: true
afterPack: scripts/after-pack.js
# Сервер запускается как отдельный процесс из app.asar.unpacked (Electron как Node).
# Модули ищутся от этого каталога, а не из app.asar, поэтому node_modules нужно
# распаковать целиком (раньше распаковывался только better-sqlite3, и express и др. не находились).
asarUnpack:
  - "src/server/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/**/*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-0.0.9-Setup.${ext}"
  signAndEditExecutable: true
  icon: "resources/icon.ico"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hearth
  runAfterFinish: true
  deleteAppDataOnUninstall: false

extraMetadata:
  main: src/main/main.js

# Нативные модули пересобираются под Electron в postinstall (electron-builder install-app-deps)
npmRebuild: false
buildDependenciesFromSource: false
