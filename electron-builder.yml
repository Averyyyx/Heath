appId: com.nexo.app
productName: Nexo
copyright: Copyright © 2026 Nexo

directories:
  output: dist
  buildResources: build

files:
  - "package.json"
  - "src/server/**/*"
  - "src/main/**/*"
  - "src/preload/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/{test,tests,__tests__,docs,example,examples}/**"

asar: true
# Сервер запускается как отдельный процесс из app.asar.unpacked (Electron как Node).
# Модули ищутся от этого каталога, а не из app.asar, поэтому node_modules нужно
# распаковать целиком (раньше распаковывался только better-sqlite3, и express и др. не находились).
asarUnpack:
  - "src/server/**/*"
  - "src/main/icons/**/*"
  - "public/**/*"
  - "node_modules/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-Setup.${ext}"
  signAndEditExecutable: true
  icon: "src/main/icons/Nexo-Desctop-ico.ico"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexo
  runAfterFinish: true
  deleteAppDataOnUninstall: false

extraMetadata:
  main: src/main/main.js

# Нативные модули пересобираются под Electron в postinstall (electron-builder install-app-deps)
npmRebuild: false
buildDependenciesFromSource: false
