name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/renderer/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci --prefix src/renderer

      - name: Download 0.0.8 UI baseline screenshots
        uses: actions/download-artifact@v4
        with:
          name: Nexo-0.0.8-UI-E2E
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 45150674684
          path: artifacts/baseline/source

      - name: Prepare baseline screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/baseline/shots, artifacts/current/shots, artifacts/diff | Out-Null
          $shots = Get-ChildItem -Path artifacts/baseline/source -Filter '*.png' -File -Recurse
          if ($shots.Count -lt 30) { throw 'The historical UI baseline is missing or incomplete.' }
          foreach ($shot in $shots) {
            Copy-Item -LiteralPath $shot.FullName -Destination (Join-Path 'artifacts/baseline/shots' $shot.Name) -Force
          }
          foreach ($required in @('workspace-dark-1440x768.png', 'workspace-light-1440x900.png', 'settings-voice-dark-1440x900.png', 'incoming-call-light-1440x900.png', 'call-connected-dark-1440x900.png')) {
            if (-not (Test-Path (Join-Path 'artifacts/baseline/shots' $required))) { throw "Baseline screenshot is missing: $required" }
          }

      - name: Compare API and event inventory with 0.0.8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/inventory | Out-Null
          node scripts/inventory.js --ref v0.0.8-alpha | Set-Content artifacts/inventory/baseline.json -Encoding utf8
          node scripts/inventory.js | Set-Content artifacts/inventory/current.json -Encoding utf8
          node scripts/inventory.js --compare artifacts/inventory/baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline API/event inventory differs.' }

      - name: Run tests and syntax checks
        timeout-minutes: 12
        run: npm test

      - name: Check Hearth brand references
        run: node scripts/check-brand.js

      - name: TypeScript no-emit check
        working-directory: src/renderer
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build:app

      - name: Build Windows installer
        run: npm run electron:build

      - name: Verify packaged Windows application
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked'
          $unpacked = Join-Path $app 'resources/app.asar.unpacked'
          $archive = Join-Path $app 'resources/app.asar'
          if (-not (Test-Path $archive)) { throw 'resources/app.asar is missing.' }
          node -e "const asar = require('@electron/asar'); const files = new Set(asar.listPackage('dist/win-unpacked/resources/app.asar').map((file) => file.replace(/^\\/+/, ''))); for (const entry of ['src/main/index.js', 'src/main/legacy-migration.js', 'src/main/windows/main-window.js', 'src/main/windows/splash-window.js', 'src/main/updater/index.js', 'src/preload/preload.js', 'src/preload/splash-preload.js', 'src/server/services/server-domain.js', 'src/server/services/dev-account.js', 'src/server/routes/server-management.js', 'src/server/routes/conversation-messages.js']) { if (!files.has(entry)) throw new Error('ASAR entry missing: ' + entry); }"
          if ($LASTEXITCODE -ne 0) { throw 'The Electron main process files are missing from app.asar.' }
          foreach ($relative in @('src/server/index.js', 'src/server/services/server-domain.js', 'src/server/services/dev-account.js', 'src/server/routes/server-management.js', 'src/shared/email-validation.js', 'src/shared/brand.js', 'public/index.html', 'node_modules/better-sqlite3/prebuilds/win32-x64.node')) {
            $target = Join-Path $unpacked $relative
            if (-not (Test-Path $target)) { throw "Unpacked application file is missing: $relative" }
          }
          if (-not (Test-Path (Join-Path $app 'Hearth.exe'))) { throw 'Hearth.exe is missing from win-unpacked.' }
          $legacyExe = 'Ne' + 'xo.exe'
          if (Test-Path (Join-Path $app $legacyExe)) { throw 'Legacy executable must not be packaged.' }

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Playwright E2E and capture current screenshots
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:ELECTRON_DESKTOP = '1'
          $env:HOST = '127.0.0.1'
          $env:NODE_ENV = 'production'
          $env:USE_MEMORY_SESSION = 'true'
          $env:CLIENT_ORIGIN = 'http://127.0.0.1:4000'
          $env:HEARTH_DEV_ACCOUNT = 'true'
          $env:HEARTH_DEV_EMAIL = 'dev@hearth.local'
          $env:HEARTH_DEV_PASSWORD = 'Hearth-E2E-Password-2026!'
          $env:SESSION_SECRET = 'hearth-e2e-temporary-session-secret'
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'hearth-e2e.db'
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'hearth-e2e-data'
          $env:HEARTH_E2E_URL = 'http://127.0.0.1:4000'
          $env:HEARTH_E2E_EMAIL = 'dev@hearth.local'
          $env:HEARTH_E2E_PASSWORD = 'Hearth-E2E-Password-2026!'
          $env:HEARTH_E2E_SCREENSHOT_DIR = 'artifacts/current/shots'
          $stdout = Join-Path $env:RUNNER_TEMP 'hearth-e2e-server.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hearth-e2e-server-error.log'
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked'
          $unpacked = Join-Path $app 'resources/app.asar.unpacked'
          $server = Start-Process -FilePath (Join-Path $app 'Hearth.exe') -ArgumentList @('src/server/index.js') -WorkingDirectory $unpacked -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4000/api/security/csrf-token' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Hearth E2E server did not become ready.'
            }
            node scripts/e2e-ui.js
            if ($LASTEXITCODE -ne 0) { throw 'Hearth Playwright UI regression failed.' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Compare UI screenshots against 0.0.8
        run: npm run visual-diff

      - name: Upload visual verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-0.0.9-visual-verification
          path: |
            artifacts/baseline/**
            artifacts/current/**
            artifacts/diff/**
            artifacts/inventory/**
            ${{ runner.temp }}/hearth-e2e-server.log
            ${{ runner.temp }}/hearth-e2e-server-error.log
          if-no-files-found: warn
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image from a clean checkout
        run: docker build --pull --tag hearth:baseline .
