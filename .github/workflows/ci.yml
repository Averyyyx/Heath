name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/renderer/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix src/renderer

      - name: Capture baseline inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/baseline, artifacts/current | Out-Null
          node scripts/inventory.js --ref v0.0.8-alpha | Set-Content artifacts/baseline/inventory.json -Encoding utf8
          node scripts/inventory.js | Set-Content artifacts/current/inventory.json -Encoding utf8
          node scripts/inventory.js --compare artifacts/baseline/inventory.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline API/event inventory differs.' }

      - name: Run tests and syntax checks
        run: npm test

      - name: TypeScript no-emit check
        working-directory: src/renderer
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build:app

      - name: Build Windows installer
        run: npm run electron:build

      - name: Verify packaged Windows application
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked'
          $unpacked = Join-Path $app 'resources/app.asar.unpacked'
          foreach ($relative in @('src/server/index.js', 'public/index.html', 'node_modules/better-sqlite3/build/Release/better_sqlite3.node')) {
            $target = Join-Path $unpacked $relative
            if (-not (Test-Path $target)) { throw "Packaged file is missing: $relative" }
          }
          if (-not (Test-Path (Join-Path $app 'Hearth.exe'))) { throw 'Hearth.exe is missing from win-unpacked.' }
          if (Test-Path (Join-Path $app 'Nexo.exe')) { throw 'Legacy Nexo.exe must not be packaged.' }

      - name: Install Playwright
        run: npm install --no-save playwright @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run baseline Playwright and capture screenshots
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:NODE_ENV = 'development'
          $env:USE_MEMORY_SESSION = 'true'
          $env:CLIENT_ORIGIN = 'http://localhost:4000'
          $env:HEARTH_DEV_ACCOUNT = 'true'
          $env:HEARTH_DEV_EMAIL = 'dev@hearth.local'
          $env:HEARTH_DEV_PASSWORD = 'Hearth-E2E-Password-2026!'
          $env:SESSION_SECRET = 'hearth-e2e-temporary-session-secret'
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'hearth-e2e.db'
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'hearth-e2e-data'
          $env:HEARTH_E2E_URL = 'http://localhost:4000'
          $env:HEARTH_E2E_EMAIL = 'dev@hearth.local'
          $env:HEARTH_E2E_PASSWORD = 'Hearth-E2E-Password-2026!'
          $env:HEARTH_E2E_SCREENSHOT_DIR = 'artifacts/baseline/shots'
          $stdout = Join-Path $env:RUNNER_TEMP 'hearth-e2e-server.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'hearth-e2e-server-error.log'
          $server = Start-Process -FilePath 'node' -ArgumentList @('src/server/index.js') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4000' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Baseline test server did not become ready.'
            }
            node scripts/e2e-ui.js
            if ($LASTEXITCODE -ne 0) { throw 'Baseline Playwright UI regression failed.' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload baseline inventory and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-0.0.9-baseline
          path: |
            artifacts/baseline/**
            artifacts/current/**
            ${{ runner.temp }}/hearth-e2e-server.log
            ${{ runner.temp }}/hearth-e2e-server-error.log
          if-no-files-found: warn
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image from a clean checkout
        run: docker build --pull --tag hearth:baseline .
