name: Nexo 0.0.6 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/0.0.6-fixes]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build React client (TypeScript + Vite)
        run: npm run build --prefix client
      - name: Build Windows installer
        run: npm run electron:build
      - name: Upload installer for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-0.0.6-alpha-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
