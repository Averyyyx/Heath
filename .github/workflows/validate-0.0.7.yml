name: Nexo 0.0.8 validation

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check references to removed root artifacts
        shell: pwsh
        run: |
          $targets = @(
            'AUDIT_REPORT.md',
            'ELECTRON_FIX_REPORT.md',
            'PROJECT_ANALYSIS.md',
            'UNNECESSARY_FILES.md',
            'GreetingScreen.png',
            'Main2png',
            'изображение.png',
            'ROADMAP.md',
            'DEV_ACCOUNT.md',
            'setup-nexo-local.md'
          )
          foreach ($target in $targets) {
            $matches = git grep -n -F -e $target HEAD -- . ':(exclude).github/workflows/validate-0.0.7.yml'
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              $matches
              throw "Reference to removed or moved root file found: $target"
            }
            if ($exitCode -gt 1) { throw "git grep failed for: $target" }
          }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Run tests and syntax checks
        run: npm test
      - name: TypeScript no-emit check
        working-directory: client
        run: npx tsc --noEmit
      - name: Build application (client + public)
        run: npm run build:app
      - name: Install Playwright
        run: npm install --no-save playwright @playwright/test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Playwright against a seeded Nexo server
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:NODE_ENV = 'development'
          $env:USE_MEMORY_SESSION = 'true'
          $env:CLIENT_ORIGIN = 'http://localhost:4000'
          $env:NEXO_DEV_ACCOUNT = 'true'
          $env:NEXO_DEV_EMAIL = 'dev@nexo.local'
          $env:NEXO_DEV_PASSWORD = 'Nexo-E2E-Password-2026!'
          $env:SESSION_SECRET = 'nexo-e2e-temporary-session-secret'
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'nexo-e2e.db'
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'nexo-e2e-data'
          $env:NEXO_E2E_URL = 'http://localhost:4000'
          $env:NEXO_E2E_EMAIL = 'dev@nexo.local'
          $env:NEXO_E2E_PASSWORD = 'Nexo-E2E-Password-2026!'
          $env:NEXO_E2E_SCREENSHOT_DIR = 'artifacts/e2e-ui'
          $stdout = Join-Path $env:RUNNER_TEMP 'nexo-e2e-server.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'nexo-e2e-server-error.log'
          $server = Start-Process -FilePath 'node' -ArgumentList @('server.js') -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4000' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Nexo test server did not become ready.'
            }
            node scripts/e2e-ui.js
            if ($LASTEXITCODE -ne 0) { throw 'Playwright UI regression failed.' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Playwright screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-0.0.8-UI-E2E
          path: |
            artifacts/e2e-ui/**
            ${{ runner.temp }}/nexo-e2e-server.log
            ${{ runner.temp }}/nexo-e2e-server-error.log
          if-no-files-found: warn
          retention-days: 10
      - name: Build Windows installer
        run: npm run electron:build
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($installer.FullName + '.sha256') -Value "$hash  $($installer.Name)" -NoNewline -Encoding ascii
      - name: Upload Windows installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-0.0.8-alpha-Windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 10

  docker-build:
    name: Docker clean-build verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image from a clean checkout
        run: docker build --pull --tag nexo:0.0.8p .
