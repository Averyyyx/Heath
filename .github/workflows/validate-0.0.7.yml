name: Nexo 0.0.8 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Run tests and syntax checks
        run: npm test
      - name: Build client (TypeScript + Vite)
        run: npm run build --prefix client
      - name: Build Windows installer
        run: npm run electron:build
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($installer.FullName + '.sha256') -Value "$hash  $($installer.Name)" -NoNewline -Encoding ascii
      - name: Upload Windows installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-0.0.8-alpha-Windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 10
