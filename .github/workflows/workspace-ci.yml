name: Nexo 0.0.4 Workspace CI

on:
  push:
    branches:
      - feature/0.0.4-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run syntax and unit checks
        run: npm test

      - name: Build React client and Windows installer
        run: npm run electron:build

      - name: Upload Windows installer for review
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-0.0.4-alpha-Windows-preview
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
