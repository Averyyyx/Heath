<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background: #262624; color: #ece9e3;
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-app-region: drag; user-select: none;
    }
    .window { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 26px 30px 22px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 27px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #55504b; border-radius: 10px; color: #df805e; font: 600 23px Georgia, serif; }
    .brand-name { color: #f0ece6; font: 24px Georgia, serif; letter-spacing: .01em; }
    .status { min-height: 22px; color: #e5e0d9; font-size: 13px; font-weight: 500; text-align: center; }
    .detail { min-height: 18px; margin-top: 7px; color: #96918a; font-size: 11px; text-align: center; }
    .progress-track { width: 100%; height: 3px; margin-top: 22px; overflow: hidden; border-radius: 4px; background: #41413e; }
    .progress-fill { width: 28%; height: 100%; border-radius: inherit; background: #df805e; animation: loading 1.5s ease-in-out infinite; }
    .progress-track.determinate .progress-fill { width: 0; animation: none; transition: width .25s ease; }
    .progress-track.hidden { visibility: hidden; }
    .footer { position: absolute; bottom: 15px; color: #77736e; font-size: 10px; letter-spacing: .04em; }
    @keyframes loading { 0% { transform: translateX(-110%); } 100% { transform: translateX(390%); } }
    @media (prefers-reduced-motion: reduce) { .progress-fill { animation-duration: 4s; } }
  </style>
</head>
<body>
  <main class="window">
    <div class="brand"><span class="brand-mark">N</span><span class="brand-name">Nexo</span></div>
    <div class="status" id="loadingText">Подготовка приложения…</div>
    <div class="detail" id="detailText">Пожалуйста, подождите</div>
    <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressBar"></div></div>
    <div class="footer" id="versionText">NEXO · ALPHA</div>
  </main>
  <script>
    const { ipcRenderer } = require('electron');
    const status = document.getElementById('loadingText');
    const detail = document.getElementById('detailText');
    const track = document.getElementById('progressTrack');
    const bar = document.getElementById('progressBar');
    const version = document.getElementById('versionText');
    ipcRenderer.on('loading-status', (_event, value) => { status.textContent = value; });
    ipcRenderer.on('app-version', (_event, value) => { version.textContent = 'NEXO · VERSION ' + value; });
    ipcRenderer.on('update-available', (_event, value) => {
      status.textContent = 'Доступно обновление';
      detail.textContent = 'Найдена версия ' + value + ' на GitHub';
      track.classList.add('determinate'); track.classList.remove('hidden');
    });
    ipcRenderer.on('update-details', (_event, value) => { detail.textContent = value; });
    ipcRenderer.on('update-progress', (_event, value) => { bar.style.width = Math.max(0, Math.min(100, Number(value) || 0)) + '%'; });
    ipcRenderer.on('update-complete', () => { status.textContent = 'Обновление установлено'; detail.textContent = 'Продолжаем запуск Nexo'; });
    ipcRenderer.on('update-not-available', (_event, message) => { status.textContent = message || 'Обновлений нет'; detail.textContent = 'Запускаем приложение'; track.classList.add('hidden'); });
    ipcRenderer.on('update-error', (_event, message) => { status.textContent = 'Не удалось проверить обновления'; detail.textContent = message || 'Запуск продолжится без обновления'; track.classList.add('hidden'); });
  </script>
</body>
</html>
