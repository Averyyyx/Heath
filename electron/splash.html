<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexo</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#262624;color:#faf9f5}
*{box-sizing:border-box}
body{margin:0;width:100vw;height:100vh;display:grid;place-items:center;background:#262624;overflow:hidden}
.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 38px 24px;text-align:center}
.mark{display:grid;width:58px;height:58px;place-items:center;border:1px solid rgba(217,119,87,.38);border-radius:18px;background:rgba(217,119,87,.12);color:#e38a6a;font:600 34px Georgia,serif;box-shadow:0 0 0 8px rgba(217,119,87,.035);animation:mark-in .7s cubic-bezier(.2,.8,.2,1) both}
h1{margin:14px 0 2px;font:600 26px Georgia,serif;letter-spacing:-.4px}
.version{color:#817f78;font:600 8px "Segoe UI",sans-serif;letter-spacing:.19em}
.status{margin-top:20px;color:#c7c4bc;font-size:11px;min-height:16px}
.phrase{margin-top:8px;color:#918e85;font:italic 12px Georgia,serif;min-height:34px;max-width:310px;line-height:1.45}
.track{width:220px;height:2px;margin-top:21px;background:#42413e;overflow:hidden;border-radius:10px}
.fill{height:100%;width:30%;background:#d97757;transform-origin:left;animation:load 2.6s ease-in-out infinite}
.footer{margin-top:17px;color:#66645e;font-size:8px;letter-spacing:.12em}
@keyframes load{0%{transform:translateX(-110%) scaleX(.25)}50%{transform:translateX(100%) scaleX(1.4)}100%{transform:translateX(360%) scaleX(.25)}}
@keyframes mark-in{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<div class="card">
  <div class="mark">N</div>
  <h1>Nexo</h1>
  <div class="version" id="version">ALPHA · CONNECTING</div>
  <div class="status" id="status">Подготавливаем ваше пространство…</div>
  <div class="phrase" id="phrase">Связь начинается с простого приветствия.</div>
  <div class="track"><div class="fill"></div></div>
  <div class="footer">A QUIETER PLACE TO CONNECT</div>
</div>
<script>
const { ipcRenderer } = require('electron');
const phrases = [
  'Здесь разговоры находят своё продолжение.',
  'Хорошие идеи редко рождаются в одиночку.',
  'Настраиваем место для следующей мысли.',
  'Пусть важное не потеряется в потоке.',
  'Каждое пространство начинается с людей.',
  'Собираем ваши разговоры в одном месте.',
  'Тишина перед началом хорошего проекта.',
  'Связь — это больше, чем список контактов.',
  'Ваша команда уже почти на месте.',
  'Идеи любят ясное пространство.',
  'Подключаемся к тому, что действительно важно.',
  'Небольшая пауза — и можно продолжать.',
  'Ни одна хорошая мысль не должна затеряться.',
  'Рабочее место для людей, а не для шума.',
  'Пусть путь от идеи до разговора будет короче.',
  'Скоро здесь появится что-то интересное.',
  'Ваше пространство, ваш ритм, ваши правила.',
  'Собираем детали, чтобы вы могли собирать идеи.',
  'Вместе проще довести начатое до конца.',
  'Каждой команде нужно своё место встречи.',
  'Подготавливаем каналы для новых открытий.',
  'Общение без лишних перегородок.',
  'Пусть нужные люди будут на расстоянии одного клика.',
  'Запускаем инструменты для совместной работы.',
  'Новый день — новый повод что-то создать.',
  'Сначала связь. Затем всё остальное.',
  'Оставим сложность внутри, а снаружи — ясность.',
  'Ваши люди, проекты и мысли скоро встретятся.',
  'Пусть разговор двигает работу вперёд.',
  'Nexo готовит для вас место.'
];
const phrase=document.getElementById('phrase');
const status=document.getElementById('status');
const version=document.getElementById('version');
let last=-1;
function rotatePhrase(){
  let next=Math.floor(Math.random()*phrases.length);
  if(next===last) next=(next+1)%phrases.length;
  last=next;
  phrase.animate([{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],{duration:450,easing:'ease-out'});
  phrase.textContent=phrases[next];
}
rotatePhrase();
setInterval(rotatePhrase,2900);
ipcRenderer.on('loading-status',(_event,text)=>{status.textContent=text;});
ipcRenderer.on('app-version',(_event,value)=>{version.textContent='ALPHA · '+value;});
ipcRenderer.on('update-status',(_event,payload)=>{
  if(payload?.message) status.textContent=payload.message;
});
</script>
</body>
</html>
